substitutions:
  name: detecteur-garage
  friendly_name: Detecteur Garage

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: led_panel
          effect: "Parking"
          brightness: 55%

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "parking-sensor-fallback"

captive_portal:

# --- Capteur ultrason JSN-SR04T (etanche) ---
sensor:
  - platform: ultrasonic
    id: garage_distance
    name: "Garage distance voiture"
    trigger_pin: GPIO5
    echo_pin: GPIO18
    update_interval: 100ms
    timeout: 4.0m
    accuracy_decimals: 2
    filters:
      - lambda: 'return isnan(x) ? 9.0 : x;'   # timeout (hors portee) -> 9 m, pas voiture -> panneau eteint
      - median:
          window_size: 3
          send_every: 1

# --- Panneau WS2812 16x16 = 256 LED ---
light:
  - platform: esp32_rmt_led_strip
    id: led_panel
    name: "Garage panneau"
    pin: GPIO13
    num_leds: 256
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_ON
    gamma_correct: 2.8
    effects:
      - addressable_lambda:
          name: "Parking"
          update_interval: 80ms
          lambda: |-
            const int W = 16, H = 16;
            it.all() = Color(0, 0, 0);
            // porte fermee/inconnue -> panneau noir (etat lu directement depuis HA, robuste aux blips/reboots)
            std::string ps = id(porte_etat).state;
            if (ps != "open" && ps != "opening" && ps != "closing") { return; }
            float d = id(garage_distance).state;   // metres (DIMINUE quand la voiture approche)
            const float TARGET = 1.806f;           // distance d'arret = declenche STOP (mesuree voiture en place)
            const float OFF    = 2.45f;            // vide mesure = 2.503 m stable => OFF juste en dessous
            // suivi mouvement : une fois la voiture immobile on eteint (sinon STOP clignote sans fin)
            static float prev_d = -100.0f;
            static uint32_t last_move = 0;
            uint32_t nowms = millis();
            if (prev_d < -50.0f) { prev_d = d; last_move = nowms; }
            if (!isnan(d) && fabsf(d - prev_d) > 0.04f) last_move = nowms;  // mouvement detecte
            if (!isnan(d)) prev_d = d;
            bool settled = (nowms - last_move) > 30000;   // immobile depuis 30 s

            // --- etat selon distance (porte ouverte = panneau allume par HA) ---
            bool stop = false;
            Color col;
            bool far = (isnan(d) || d > OFF);      // porte ouverte mais pas (encore) de voiture proche
            if (far) {
              col = Color(0, 180, 0);              // FLECHE VERTE "entrez" des l'ouverture de la porte
            } else {
              if (settled) { return; }             // voiture garee et immobile -> panneau eteint
              if (d <= TARGET + 0.05f)      { stop = true; col = Color(220, 0, 0); }  // STOP (<=1.86)
              else if (d <= TARGET + 0.12f) { col = Color(220, 0, 0); }               // rouge (<=1.93)
              else if (d <= TARGET + 0.19f) { col = Color(220, 80, 0); }              // orange (<=2.00)
              else                          { col = Color(0, 180, 0); }               // vert (>2.00)
            }
            bool blink_on = (millis() / 350) % 2 == 0;

            // --- compensation rotation du panneau ---
            const float ROT = 90.0f;      // correction 90 deg vers la droite (si mauvais sens : -90)
            const bool  SERPENTINE = true; // si l'image est dechiree en escalier : passer a false
            const bool  FLIP_Y = false;    // si fleche a l'envers / texte mirroir : passer a true
            const float cs = cosf(ROT * 3.14159265f / 180.0f);
            const float sn = sinf(ROT * 3.14159265f / 180.0f);

            // police 5x7 pour "STOP" (bit4 = colonne de gauche)
            static const uint8_t FS[7] = {0b01111,0b10000,0b10000,0b01110,0b00001,0b00001,0b11110};
            static const uint8_t FT[7] = {0b11111,0b00100,0b00100,0b00100,0b00100,0b00100,0b00100};
            static const uint8_t FO[7] = {0b01110,0b10001,0b10001,0b10001,0b10001,0b10001,0b01110};
            static const uint8_t FP[7] = {0b11110,0b10001,0b10001,0b11110,0b10000,0b10000,0b10000};
            auto stop_px = [&](int rx, int ry) -> bool {
              const uint8_t* f = nullptr; int c0 = 0, r0 = 0;
              if (ry >= 1 && ry <= 7) {            // ligne haute : S  T
                r0 = ry - 1;
                if (rx >= 1 && rx <= 5)       { f = FS; c0 = rx - 1; }
                else if (rx >= 9 && rx <= 13) { f = FT; c0 = rx - 9; }
              } else if (ry >= 9 && ry <= 15) {    // ligne basse : O  P
                r0 = ry - 9;
                if (rx >= 1 && rx <= 5)       { f = FO; c0 = rx - 1; }
                else if (rx >= 9 && rx <= 13) { f = FP; c0 = rx - 9; }
              }
              if (!f) return false;
              return (f[r0] >> (4 - c0)) & 1;
            };

            for (int y = 0; y < H; y++) {
              for (int x = 0; x < W; x++) {
                float cx = x - 7.5f, cy = y - 7.5f;
                float u =  cx * cs - cy * sn;   // image redressee : u = horizontal
                float v =  cx * sn + cy * cs;   //                   v = vertical (haut +)
                if (FLIP_Y) v = -v;
                bool on = false;
                Color c = col;
                if (stop) {
                  // texte "STOP" rouge clignotant
                  int rx = (int)roundf(u + 7.5f);
                  int ry = (int)roundf(7.5f - v);
                  if (rx >= 0 && rx < W && ry >= 0 && ry < H && stop_px(rx, ry)) {
                    on = true; c = blink_on ? Color(230, 0, 0) : Color(30, 0, 0);
                  }
                } else {
                  // fleche pleine pointe en haut, couleur = etat
                  const float HEAD_TOP = 6.5f, HEAD_BASE = 1.0f;
                  bool head  = (v <= HEAD_TOP) && (v >= HEAD_BASE) && (fabsf(u) <= (HEAD_TOP - v) * 0.9f);
                  bool shaft = (v < HEAD_BASE) && (v >= -6.0f) && (fabsf(u) <= 1.6f);
                  if (head || shaft) on = true;
                }
                if (on) {
                  int xx = (SERPENTINE && (y % 2 == 1)) ? (W - 1 - x) : x;
                  it[y * W + xx] = c;
                }
              }
            }

text_sensor:
  - platform: homeassistant
    id: porte_etat
    entity_id: cover.garage_door

binary_sensor:
  - platform: template
    name: "Garage place occupee"
    device_class: occupancy
    lambda: |-
      float d = id(garage_distance).state;
      if (isnan(d)) return false;
      return d < 1.90f;
